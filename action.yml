name: 'Changesets Release Commenter'
description: 'Comment on the PRs and issues shipped by a Changesets release, naming the packages each one shipped in.'
author: 'marcalexiei'

branding:
  icon: 'message-square'
  color: 'blue'

inputs:
  github-token:
    description: 'Token used to read PRs and post comments. Needs pull-requests:write and issues:write.'
    required: false
    default: ${{ github.token }}
  published-packages:
    description: 'The `published-packages` output of changesets/action: [{"name","version"},…].'
    required: true
  comment-on:
    description: 'What to comment on: `both`, `prs`, or `issues`.'
    required: false
    default: 'both'
  resolve-via:
    description: 'How to find the shipped PRs: `auto`, `changesets`, or `changelog`.'
    required: false
    default: 'auto'
  marker-id:
    description: 'Hidden marker used to avoid double-posting. Must differ from other comment ids on the thread.'
    required: false
    default: 'changesets-release-commenter'
  link-releases:
    description: 'Link each package@version to its GitHub release page. Set false if releases are not created.'
    required: false
    default: 'true'
  dry-run:
    description: 'Resolve and log everything, but post nothing.'
    required: false
    default: 'false'

outputs:
  released:
    description: 'JSON object mapping PR number to the `name@version` list it shipped in.'

runs:
  using: 'node24'
  main: 'dist/index.js'
