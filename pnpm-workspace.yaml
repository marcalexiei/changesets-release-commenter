# @changesets/cli floats these to releases newer than minimumReleaseAge admits; these are the
# newest that clear it.
overrides:
  '@clack/core': 1.5.0
  '@clack/prompts': 1.8.0

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
