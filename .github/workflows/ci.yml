name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a superseded PR push is worth cancelling; a merge_group run gates the merge itself.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@5d5d93ced9992933275f5821cda2bddd724de2f6 # feat/setup-node-and-pnpm-caching
      - name: Lint
        run: pnpm lint:js:ci
      - name: Format
        run: pnpm format:check
      - name: Lint (knip)
        run: pnpm lint:knip

  typecheck:
    name: Typecheck
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@5d5d93ced9992933275f5821cda2bddd724de2f6 # feat/setup-node-and-pnpm-caching
        with:
          save-cache: false
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@5d5d93ced9992933275f5821cda2bddd724de2f6 # feat/setup-node-and-pnpm-caching
        with:
          save-cache: false
      - name: Test
        run: pnpm test

  build:
    name: Build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@5d5d93ced9992933275f5821cda2bddd724de2f6 # feat/setup-node-and-pnpm-caching
        with:
          save-cache: false
      - name: Build
        run: pnpm build

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, test, build]
    steps:
      - name: Exit with error if some jobs are not successful
        run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
