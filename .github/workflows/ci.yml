name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    branches:
      - main

concurrency:
  # head_ref is set only on PRs, so push and merge_group runs get a group per commit and are never cancelled
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@0ac3ea042e173813ebc7b086c174705c5bfc0fb6 # v2.6.2
      - name: Lint
        run: pnpm lint:js:ci
      - name: Format
        run: pnpm format:check
      - name: Lint (knip)
        run: pnpm lint:knip

  typecheck:
    name: Typecheck
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@0ac3ea042e173813ebc7b086c174705c5bfc0fb6 # v2.6.2
        with:
          save-cache: false # shares its cache key with the lint job
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@0ac3ea042e173813ebc7b086c174705c5bfc0fb6 # v2.6.2
        with:
          save-cache: false # shares its cache key with the lint job
      - name: Test
        run: pnpm test

  build:
    name: Build
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read # the smoke test reads the comments on a released PR
      issues: read # and the issues that PR closes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the smoke test resolves an earlier release from its tag
      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@0ac3ea042e173813ebc7b086c174705c5bfc0fb6 # v2.6.2
        with:
          save-cache: false # shares its cache key with the lint job
      - name: Build
        run: pnpm build
      # The release ships this bundle without ever running it otherwise. Run directly: `uses:`
      # resolves the action from the commit, where the gitignored `dist/` does not exist.
      - name: Run the built action against v0.3.1
        id: smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          env \
            "INPUT_GITHUB-TOKEN=${GITHUB_TOKEN}" \
            'INPUT_PUBLISHED-PACKAGES=[{"name":"changesets-release-commenter","version":"0.3.1"}]' \
            INPUT_COMMENT-ON=both \
            INPUT_RESOLVE-VIA=auto \
            INPUT_MARKER-ID=changesets-release-commenter \
            INPUT_INCLUDE-DEPENDENTS=true \
            INPUT_LINK-RELEASES=true \
            INPUT_FOOTER=true \
            INPUT_DRY-RUN=true \
            node dist/index.js
      - name: Check what it resolved
        env:
          RELEASED: ${{ steps.smoke.outputs.released }}
          EXPECTED: '{"37":{"direct":["changesets-release-commenter@0.3.1"],"dependents":[]}}'
        run: |
          if [ "${RELEASED}" != "${EXPECTED}" ]; then
            echo "::error::released is ${RELEASED}, expected ${EXPECTED}"
            exit 1
          fi

  github-actions-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the parent the changed-paths step diffs against
      - name: Check changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        # a pull request checks out its merge commit, whose first parent is the base branch
        run: |
          if [ "${EVENT_NAME}" != pull_request ] || [ -n "$(git diff --name-only HEAD^1 HEAD -- .github)" ]; then
            echo "github=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run zizmor
        if: ${{ steps.changes.outputs.github == 'true' }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
      - name: Run jactionlint
        # still runs when zizmor fails, so one run reports both
        if: ${{ !cancelled() && steps.changes.outputs.github == 'true' }}
        uses: jdx/jactionlint@a0bb9f012b6b5760c17c9ccd040001d08002a10e # v2.1.0
        with:
          online: strict # a lookup it cannot make fails the job instead of being skipped

  ci-ok:
    name: CI OK
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    if: ${{ always() }}
    needs:
      - lint
      - typecheck
      - test
      - build
      - github-actions-audit
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: marcalexiei/github-actions/check-needs@0ac3ea042e173813ebc7b086c174705c5bfc0fb6 # v2.6.2
        with:
          needs: ${{ toJSON(needs) }}
