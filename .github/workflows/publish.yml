name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Version or release
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, and the major release line
      pull-requests: write # the version PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release.ts force-moves the major branch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Create version PR or release
        uses: changesets/action@v2
        with:
          version-script: 'npm run bump'
          publish-script: 'npm run release'
          commit-message: 'chore: version'
          pr-title: 'chore: version'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
