name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Version or release
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: read # the app token does the writing

    steps:
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release.ts force-moves the major release line
          persist-credentials: false # release.ts authenticates with the app token instead

      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1

      - run: pnpm build

      - name: Create version PR or release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          version-script: 'pnpm bump'
          publish-script: 'pnpm release'
          commit-message: 'chore: version'
          pr-title: 'chore: version'
        env:
          GITHUB_TOKEN: ${{ steps.release-helper.outputs.token }}
